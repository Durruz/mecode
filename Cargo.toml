[workspace]
resolver = "3"
members = ["crates/mecode-core", "crates/mecode-server"]
# Tauri-оболочка живёт отдельно (свой workspace), чтобы её сборка не мешала ядру.
exclude = ["desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
